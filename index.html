<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow Station Calc</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:14px;background:#f3f5f8;color:#123}h1{font-size:1.2em}label{display:block;margin-top:12px;font-weight:600}select,input{width:100%;font-size:1.1em;padding:10px;margin-top:4px;box-sizing:border-box;border:1px solid #9ab;border-radius:8px}.row{display:flex;gap:8px}.row>*{flex:1}#out{margin-top:16px;background:#0b5;color:#fff;padding:16px;border-radius:10px;font-size:2em;text-align:center}#cvl{font-size:.9em;margin-top:6px}.note{font-size:.85em;color:#456;margin-top:8px;word-break:break-all}</style></head><body>
<h1>Flow Station Calculator</h1>
<label>Brand</label><select id="b"></select>
<label>Model / series</label><select id="m"></select>
<div id="cust" style="display:none"><label>Cv from tag</label><input id="cv" type="number" inputmode="decimal" step="any"></div>
<label id="sl">Size</label><select id="s"></select>
<label id="pl">Setting / orifice</label><select id="p"></select><input id="t" type="number" inputmode="decimal" step="any" placeholder="required">
<label>Differential reading</label><div class="row"><input id="dp" type="number" inputmode="decimal" step="any" placeholder="0"><select id="u"><option value="ft">ft H2O</option><option value="psi">psi</option><option value="inwc">in. w.c.</option></select></div>
<div id="out">— GPM</div><div id="cvl"></div><div class="note" id="note"></div>
<p class="note">GPM = Cv × √ΔP(psi); psi = ft ÷ 2.31 = in.wc ÷ 27.68. Water at ~60°F; correct for glycol per manufacturer.</p>

};

const stadKv={"1/2\" (DN15)":[0.136,0.226,0.347,0.618,0.931,1.46,2.07,2.56],

const stad={};for(const s in stadKv)stad[s]={pts:stadT.map((t,i)=>[t,+(stadKv[s][i]*KV2CV).toFixed(3)])};
const one=(cv,l)=>[{label:l||"Full open",cv}];
const DATA={
"Bell & Gossett":{"Circuit Setter Plus CB":{src:SRC.bg,adj:"Setting, % open (only 100 published)",note:"Full-open Cv only. Valve must be at 100% open (0°) for this Cv to be valid.",sizes:{
"1/2\" CB":{pts:[[0,1.52],[10,0.94],[30,0.27],[40,0.13]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"3/4\" CB":{pts:[[0,2.75],[10,2.05],[20,1.35],[30,0.8],[40,0.44]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"1\" CB":{pts:[[0,5.75],[10,4.1],[20,2.71],[30,1.65],[40,0.97]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"1-1/4\" CB":{pts:[[0,12.5],[10,9.55],[20,6.9],[30,4.55],[40,2.78]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"1-1/2\" CB":{pts:[[0,19.9],[10,16.1],[20,12.2],[30,8.45],[40,5.7]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"2\" CB":{pts:[[0,40],[10,28],[20,17.8],[30,10.65],[40,6.1]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"2-1/2\" CB":{pts:[[0,65],[10,47.75],[20,33],[30,20.8],[40,12.5]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"3\" CB-3F":{pts:[[0,112],[10,85],[20,58],[30,38.75],[40,22.9]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"4\" CB-4F/4G":{pts:[[0,250],[10,160],[20,103],[30,61],[40,29]],adj:"Setting (0–40, per System Syzer scale)",src:"B&G System Syzer app (Cv per setting), supplied by user"}}},

"Circuit Setter LG-CB":{src:"B&G System Syzer app (Cv per setting), supplied by user",adj:"% open",note:"Per-setting Cv.",sizes:{"4\" LG-CB":{pts:[[10,28],[20,51],[30,70],[40,91],[50,122],[60,163],[70,208],[80,253],[90,295],[100,332]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"5\" LG-CB":{pts:[[10,37],[20,65],[40,124],[60,235],[80,342],[100,433]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"6\" LG-CB":{pts:[[10,53],[20,88],[40,176],[60,341],[80,496],[100,658]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"8\" LG-CB":{pts:[[10,72],[20,136],[40,248],[60,457],[80,680],[100,869]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"10\" LG-CB":{pts:[[100,1650]],adj:"% open (only 100 published)",note:"rep-sheet value, unverified (R.L. Deppmann sizing sheet).",src:"https://www.deppmann.com/wp-content/uploads/2015/09/2.2-Selection-and-Design-Tools-Circuit-Setter-Sheet.pdf"},"12\" LG-CB":{pts:[[100,2200]],adj:"% open (only 100 published)",note:"rep-sheet value, unverified (R.L. Deppmann sizing sheet).",src:"https://www.deppmann.com/wp-content/uploads/2015/09/2.2-Selection-and-Design-Tools-Circuit-Setter-Sheet.pdf"}}},
"3D Triple Duty Valve":{src:"B&G System Syzer app (Cv per setting), supplied by user",adj:"% open",note:"Per-setting Cv.",sizes:{"2\" 3D":{pts:[[10,11.25],[20,26.33],[40,47.49],[60,73.12],[80,97.21],[100,113.99]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"2-1/2\" 3D":{pts:[[10,14.49],[20,28.23],[40,55.09],[60,78.31],[80,91.56],[100,106.15]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"3\" 3D":{pts:[[10,22.68],[20,50.98],[40,111],[60,150.12],[80,197.64],[100,240.31]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"4\" 3D":{pts:[[10,52.43],[20,93.81],[40,187.72],[60,281.93],[80,373.84],[100,461.77]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"5\" 3D":{pts:[[10,57.91],[20,125.46],[40,263.71],[60,398.07],[80,525.8],[100,636.6]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"6\" 3D":{pts:[[10,106.39],[20,186.92],[40,351],[60,531.48],[80,708.64],[100,876.33]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"8\" 3D":{pts:[[10,113.99],[20,241.81],[40,481.29],[60,731.16],[80,981.07],[100,1232.78]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"10\" 3D":{pts:[[10,199.35],[20,430.84],[40,877.5],[60,1335.07],[80,1831.18],[100,2332.77]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"}}},
"3DS Triple Duty Valve (straight)":{src:"B&G System Syzer app (Cv per setting), supplied by user",adj:"% open",note:"Per-setting Cv.",sizes:{"2\" 3DS":{pts:[[10,12.16],[20,25.33],[40,45.6],[60,62.05],[80,75.23],[100,85.02]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"2-1/2\" 3DS":{pts:[[10,19.44],[20,34.47],[40,60.93],[60,86.16],[80,101.66],[100,115.06]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"3\" 3DS":{pts:[[10,36.07],[20,56.63],[40,104.26],[45,116.72],[50,129.19],[70,165.26],[75,173.26],[80,181.27],[100,203.1]],adj:"% open (10–100)",note:"NOTE: 55–68% open is interpolated (System Syzer gave inconsistent values there, so they were omitted).",src:"B&G System Syzer app (Cv per setting), supplied by user"},"4\" 3DS":{pts:[[10,44.05],[20,88.08],[40,171.65],[60,248.19],[80,305.87],[100,353.24]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"5\" 3DS":{pts:[[10,55.5],[20,113.99],[40,229.78],[60,326.26],[80,430.84],[100,506.38]],adj:"% open (10–100)",note:"NOTE: some values (113.99, 430.84) repeat other tables in the app; verify.",src:"B&G System Syzer app (Cv per setting), supplied by user"},"6\" 3DS":{pts:[[10,84.96],[20,169.93],[40,333.25],[60,480.62],[70,556.84],[90,693.7],[100,762.99]],adj:"% open (10–100)",note:"NOTE: 80% open is interpolated (System Syzer value there was a data glitch, so it was omitted).",src:"B&G System Syzer app (Cv per setting), supplied by user"},"8\" 3DS":{pts:[[10,104.26],[20,223.49],[40,465.36],[60,690.54],[80,894.21],[100,1074.71]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"10\" 3DS":{pts:[[10,201.06],[20,425.18],[40,849.63],[60,1230.75],[80,1564.3],[100,1846.13]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"},"12\" 3DS":{pts:[[10,241.81],[20,521.31],[40,1063.91],[60,1551.21],[80,1996.39],[100,2433.35]],adj:"% open (10–100)",note:"NOTE: 10% value 241.81 repeats the 8\" 3D 20% value in the app; verify.",src:"B&G System Syzer app (Cv per setting), supplied by user"},"14\" 3DS":{pts:[[10,269.36],[20,680.65],[40,1387.44],[60,2010.6],[80,2566.78],[100,3022.99]],adj:"% open (10–100)",src:"B&G System Syzer app (Cv per setting), supplied by user"}}},
"Circuit Setter RF":{src:SRC.bg,adj:"Setting, % open (only 100 published)",note:"Full-open Cv only.",sizes:{"1/2\" RF":{pts:[[100,0.7]]},"3/4\" RF":{pts:[[100,0.75]]}}}},
"IMI Tour & Andersson":{"STAD (PN25)":{src:SRC.stad,adj:"Handwheel turns (0.5–4)",note:"Kv per handwheel turns converted Cv = 1.156 x Kv.",sizes:stad}},
"Nexus Valve":{"UltraXB / UB Orturi":{src:SRC.nex,note:"Pick the orifice code stamped on the tag. Nexus: GPM = sqrt(dP in.wc) x Cv/5.3 (same as Cv x sqrt(psi)).",sizes:{
"1/2\", 3/4\" LO, 1\" LO":[{label:"1A",cv:0.66},{label:"1B",cv:1.32},{label:"1C",cv:3.53},{label:"1D",cv:0.30}],
"3/4\" STD, 1\" STD, 1-1/4\" LO":[{label:"2A",cv:2.46},{label:"2B",cv:1.32},{label:"3A",cv:3.53},{label:"3B",cv:7.45},{label:"3C",cv:16.6}],
"1-1/4\" STD, 1-1/2\"":[{label:"4A",cv:16.6},{label:"5A",cv:29.7}],
"2\", 2-1/2\"":[{label:"6A",cv:51.6},{label:"6B",cv:29.7}]}}},
"Griswold":{"QuickSet / Metering Station 2-1/2\"-4\" (signal Fc)":{src:SRC.gw,fc:true,note:"Uses Griswold flow constant Fc: GPM = Fc x sqrt(signal in.wc), straight-pipe install. Do NOT use the catalog Cv (that is permanent pressure drop).",sizes:{
"2-1/2\"":[{label:"Straight pipe (Fc 8.7)",cv:8.7}],"3\"":[{label:"Straight pipe (Fc 14.7)",cv:14.7}],"4\"":[{label:"Straight pipe (Fc 26)",cv:26}]}}},
"Flow Design (IMI FDI)":{"AccuSetter UA (venturi)":{src:SRC.fd,note:"Pick body + venturi number from the tag. Cv rating from submittal.",sizes:{
"A body":[{label:"Venturi 1",cv:0.28},{label:"Venturi 2",cv:0.77},{label:"Venturi 3",cv:2.2},{label:"Venturi 4",cv:4.8}],
"B body":[{label:"Venturi 5",cv:6.0},{label:"Venturi 6",cv:18.0},{label:"Venturi 7",cv:18.0}],
"C body":[{label:"Venturi 8",cv:68.0}]}}}
};
function toPsi(v,u){return u==="psi"?v:u==="ft"?v/2.31:v/27.68;}
function toInwc(v,u){return toPsi(v,u)*27.68;}
function gpm(cv,v,u,fc){if(!(v>0))return 0;return fc?cv*Math.sqrt(toInwc(v,u)):cv*Math.sqrt(toPsi(v,u));}
if(typeof module!=="undefined")module.exports={DATA,gpm,toPsi};
DATA["Custom Cv (from tag)"]={"Custom":{custom:true,sizes:{}}};
function interp(pts,x){if(!(x>=0))return{err:"Enter the valve setting."};const lo=pts[0][0],hi=pts[pts.length-1][0];
for(const p of pts)if(Math.abs(p[0]-x)<1e-9)return{cv:p[1],exact:true};
if(x<lo||x>hi)return{err:"No published Cv at this setting (published: "+pts.map(p=>p[0]).join(", ")+")."};
for(let i=1;i<pts.length;i++)if(x<pts[i][0]){const a=pts[i-1],b=pts[i];return{cv:a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]),exact:false};}}
const $=id=>document.getElementById(id);
function fill(sel,arr){sel.innerHTML=arr.map((x,i)=>`<option value="${i}">${x}</option>`).join("");}
const B=Object.keys(DATA);fill($("b"),B);
function mods(){return DATA[B[$("b").value]];}
function mod(){const M=mods();return M[Object.keys(M)[$("m").value]];}
function onB(){fill($("m"),Object.keys(mods()));onM();}
function onM(){const x=mod();const c=!!x.custom;$("cust").style.display=c?"":"none";["s","p","sl","pl"].forEach(i=>$(i).style.display=c?"none":"");if(!c)fill($("s"),Object.keys(x.sizes));onS();}
function onS(){const x=mod();const a=!!x.adj&&!x.custom;$("t").style.display=a?"":"none";$("p").style.display=(a||x.custom)?"none":"";if(!x.custom){$("pl").textContent=a?((x.sizes[Object.keys(x.sizes)[$("s").value]]||{}).adj||x.adj):"Orifice / venturi (fixed – no setting needed)";if(!a){const z=x.sizes[Object.keys(x.sizes)[$("s").value]];fill($("p"),z.map(e=>e.label));$("p").value=z.length-1;}}calc();}
function calc(){const x=mod();let cv,fc=false,extra="";if(x.custom)cv=parseFloat($("cv").value);else{const z=x.sizes[Object.keys(x.sizes)[$("s").value]];fc=!!x.fc;if(x.adj){const r=interp(z.pts,parseFloat($("t").value));if(r.err){$("out").textContent="— GPM";$("cvl").textContent=r.err;$("note").textContent=(z.note?z.note+" ":"")+(z.src?"Per-setting Cv. Source: "+z.src:x.note+" Source: "+x.src);return;}cv=+r.cv.toFixed(3);extra=r.exact?" (published)":" (INTERPOLATED)";}else cv=z[$("p").value].cv;}
const g=gpm(cv,parseFloat($("dp").value),$("u").value,fc);$("out").textContent=(g?g.toFixed(g<10?2:1):"—")+" GPM";
$("cvl").textContent=cv?(fc?"Fc = ":"Cv = ")+cv+extra+"  |  ΔP = "+(toPsi(parseFloat($("dp").value)||0,$("u").value)).toFixed(3)+" psi":"";
{const z2=x.custom?null:x.sizes[Object.keys(x.sizes)[$("s").value]];$("note").textContent=x.custom?"Use the Cv stamped on the tag.":((z2&&z2.note?z2.note+" ":"")+((z2&&z2.src)?"Per-setting Cv. Source: "+z2.src:x.note+" Source: "+x.src));}}
$("b").onchange=onB;$("m").onchange=onM;$("s").onchange=onS;["p","u"].forEach(i=>$(i).onchange=calc);["dp","cv","t"].forEach(i=>$(i).oninput=calc);onB();
</script></body></html>
